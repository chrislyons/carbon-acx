---
name: Release

'on':
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        run: pip install poetry==1.8.3

      - name: Verify pinned toolchain
        run: ./scripts/bootstrap.sh --check-only

      - name: Configure Poetry
        run: poetry config virtualenvs.create false

      - name: Install dependencies
        run: poetry install --with dev --extras db --no-root

      - name: Validate data and provenance gates
        env:
          ACX_GENERATED_AT: "1970-01-01T00:00:00+00:00"
          ACX_AUDIT_DATE: "1970-01-01"
        run: |
          make validate
          make verify_manifests
          make validate-manifests

      - name: Build verified artifacts
        env:
          ACX_GENERATED_AT: "1970-01-01T00:00:00+00:00"
        run: make build

      - name: Generate SBOM
        run: make sbom

      - name: Publish release assets
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844  # v1
        with:
          files: dist/sbom/**
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
