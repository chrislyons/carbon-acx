---
name: Release

'on':
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ACX_GENERATED_AT: "1970-01-01T00:00:00+00:00"
      # ACX_AUDIT_DATE is set from the current UTC date below.
      PYTHONPATH: "."
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false

      - name: Set release audit date
        run: echo "ACX_AUDIT_DATE=$(date -u +%F)" >> "$GITHUB_ENV"

      # Toolchains must exist before ./scripts/bootstrap.sh --check-only runs:
      # the bootstrap check verifies Node, pnpm, Python, and Poetry pins.
      - name: Determine required Node version
        id: node_engine
        run: |
          node_version=$(jq -r '.engines.node // "20.19.4"' package.json)
          echo "node_version=$node_version" >> "$GITHUB_OUTPUT"

      - name: Setup Node (use package.json engines)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: ${{ steps.node_engine.outputs.node_version }}

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1  # v4
        with:
          version: 10.5.2
          run_install: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.11'

      - name: Install Poetry
        uses: abatilo/actions-poetry@fd0e6716a0de25ef6ade151b8b53190b0376acfd  # v3
        with:
          poetry-version: '2.2.1'

      - name: Verify pinned toolchain
        run: ./scripts/bootstrap.sh --check-only

      - name: Configure Poetry
        run: poetry config virtualenvs.create false

      - name: Install Python dependencies
        timeout-minutes: 15
        run: poetry install --with dev --extras db --no-root --no-interaction

      - name: Install workspace dependencies
        timeout-minutes: 15
        run: |
          pnpm install --frozen-lockfile -w
          pnpm --filter carbon-acx-web install --frozen-lockfile

      - name: Validate data and provenance gates
        timeout-minutes: 20
        run: make validate

      # Build the canonical deployable bundle exactly as CI does: content-hashed
      # artifacts, the packaged Pages payload, the static site, and the SBOM.
      - name: Build deployable Pages bundle
        timeout-minutes: 30
        env:
          ACX040_HASHED: "1"
        run: make package

      - name: Verify manifests and packaged bundle
        timeout-minutes: 15
        env:
          ACX040_HASHED: "1"
        run: |
          make verify_manifests
          make validate-manifests

      - name: Validate deployable Pages bundle
        timeout-minutes: 10
        run: make validate-site

      - name: Assemble release assets
        run: |
          set -euo pipefail
          mkdir -p release-assets
          tar -czf release-assets/carbon-acx-site.tar.gz -C dist site
          tar -czf release-assets/carbon-acx-artifacts.tar.gz -C dist artifacts
          tar -czf release-assets/carbon-acx-packaged-artifacts.tar.gz -C dist packaged-artifacts
          ls -l release-assets dist/sbom

      - name: Publish release assets
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844  # v1
        with:
          files: |
            release-assets/carbon-acx-site.tar.gz
            release-assets/carbon-acx-artifacts.tar.gz
            release-assets/carbon-acx-packaged-artifacts.tar.gz
            dist/sbom/cyclonedx.json
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
