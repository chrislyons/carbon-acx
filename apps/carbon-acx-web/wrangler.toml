# Wrangler configuration for Cloudflare Pages
# Pages serve the prebuilt bundle assembled by `make package` at the repo root
# (`dist/site`), not the raw Next.js export in this workspace. Path is resolved
# relative to this wrangler.toml.
name = "carbon-acx"
compatibility_date = "2025-01-01"
pages_build_output_dir = "../../dist/site"

[env.production]
routes = [
  { pattern = "carbon-acx.pages.dev", custom_domain = true }
]

[env.preview]
