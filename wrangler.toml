# Cloudflare Pages project configuration.
# The deployable bundle is the prebuilt `dist/site` tree produced by
# `make package` (static app + /artifacts + _headers + _redirects +
# artifacts/index.json). `make validate-site` smoke-checks that bundle.
name = "carbon-acx"
compatibility_date = "2025-01-01"
pages_build_output_dir = "dist/site"
